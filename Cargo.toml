[package]
name = "leopard-switch"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
]

# Optimizations to minimize binary size and memory
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
